name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.86.5
        with:
          tool: typstyle

      - name: Lint
        run: typstyle --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5.2.0

      - name: Setup Typst Packages
        run: |
          cd packages/invoicing/ && ../../scripts/package @local && cd -
          cd packages/logotype/ && ../../scripts/package @local && cd -
      - uses: taiki-e/install-action@v2.86.5
        with:
          tool: tytanic

      - name: Run Tytanic
        run: tt run --no-fail-fast --root ./packages/logotype/
        env:
          TYPST_FONT_PATHS: "/opt/typst/assets/fonts"

      - name: Archive diffs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: |
            **/tests/**/diff/*.png
            **/tests/**/out/*.png
            **/tests/**/ref/*.png
          retention-days: 5

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5.2.0

      - name: Setup Typst Packages
        run: |
          cd packages/invoicing/ && ../../scripts/package @local && cd -
          cd packages/logotype/ && ../../scripts/package @local && cd -

      - name: Run Typst
        run: typst compile --root $PWD packages/invoicing/tests/template/test.typ dist/test.png
        env:
          TYPST_FONT_PATHS: "/opt/typst/assets/fonts"

      - name: Archive diffs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: |
            dist/*.png
          retention-days: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          tags: |
            ghcr.io/${{ vars.DOCKER_IMAGE }}:latest
          load: true

      - name: Test
        run: |
          docker run --rm -v "${PWD}/packages/invoicing/template:/opt/data" ghcr.io/${{ vars.DOCKER_IMAGE }} c "/opt/data/main.typ"
