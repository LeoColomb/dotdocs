name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run typstyle
        uses: typstyle-rs/typstyle-action@v1.0.1
        with:
          opts: --check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5.2.0

      - name: Setup Typst Packages
        run: scripts/package @local

      - name: Setup Typst Fonts
        run: scripts/fonts
        env:
          TYPST_FONT_PATHS: "/opt/typst/assets/fonts"

      - uses: typst-community/setup-tytanic@v1.1.0
      - name: Run Tytanic
        run: tt run --no-fail-fast --warnings promote --root .
        env:
          TYPST_FONT_PATHS: "/opt/typst/assets/fonts"

      - name: Archive diffs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: |
            **/tests/**/diff/*.png
            **/tests/**/out/*.png
            **/tests/**/ref/*.png
          retention-days: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          tags: |
            ghcr.io/${{ vars.DOCKER_IMAGE }}:latest
          load: true

      - name: Test
        run: |
          docker run --rm -v "${PWD}/packages/invoicing/template:/opt/data" ghcr.io/${{ vars.DOCKER_IMAGE }} c "/opt/data/main.typ"
